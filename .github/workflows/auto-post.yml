name: AI Auto Blog Post

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate blog post with AI
        id: generate
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          TODAY=$(date +%Y-%m-%d)
          DAY_OF_WEEK=$(date +%u)

          if [ "$DAY_OF_WEEK" = "1" ]; then
            SLUG="hydra-ecosystem-${TODAY}"
            TAGS='["hydra","radix","ecosystem"]'
            TOPIC="Write about the HYDRA ecosystem on Radix DLT: token updates, HydraSwap, HydraBurn, HydraBattleArena, or community news. Be hype-driven and energetic."
          elif [ "$DAY_OF_WEEK" = "2" ]; then
            SLUG="dogecoin-story-${TODAY}"
            TAGS='["dogecoin","doge","memecoin","history"]'
            TOPIC="Write an in-depth story about how Dogecoin (DOGE) exploded in popularity: origin, community, Elon Musk effect, key price moments. Educational and engaging tone."
          elif [ "$DAY_OF_WEEK" = "3" ]; then
            SLUG="shiba-inu-deep-dive-${TODAY}"
            TAGS='["shiba","shib","memecoin","history"]'
            TOPIC="Write a deep dive into Shiba Inu (SHIB): how it launched, the ShibArmy, the burn mechanism, and why it became a top memecoin. Educational tone."
          elif [ "$DAY_OF_WEEK" = "4" ]; then
            SLUG="pepe-coin-story-${TODAY}"
            TAGS='["pepe","memecoin","history","culture"]'
            TOPIC="Write about Pepe (PEPE) coin: how a frog meme became a billion-dollar token in weeks, community culture, and what made it explode. Educational and fun tone."
          elif [ "$DAY_OF_WEEK" = "5" ]; then
            SLUG="what-makes-memecoins-explode-${TODAY}"
            TAGS='["memecoin","guide","doge","shib","pepe"]'
            TOPIC="Write a guide: What makes a memecoin explode? Analyze patterns from DOGE, SHIB, PEPE, WIF, BONK and others. What do they have in common? Community, timing, narrative. Educational."
          elif [ "$DAY_OF_WEEK" = "6" ]; then
            SLUG="solana-memecoins-${TODAY}"
            TAGS='["wif","bonk","solana","memecoin"]'
            TOPIC="Write about Solana memecoins WIF (dogwifhat) and BONK: how they launched, viral growth, and community culture. Compare with Ethereum memecoins. Educational."
          else
            SLUG="why-memecoins-matter-${TODAY}"
            TAGS='["memecoin","hydra","community","opinion"]'
            TOPIC="Write a Sunday opinion piece: Why memecoins matter in crypto. Community, culture, financial inclusion, and fun. Reference HYDRA as an example of a community-driven ecosystem."
          fi

          DISCLAIMER="\n\n---\n\n**Disclaimer:** This article is for educational and entertainment purposes only. Nothing in this post constitutes financial advice. Cryptocurrency investments are highly volatile and speculative. Always do your own research (DYOR) before making any investment decisions."

          FULL_PROMPT="You are the content writer for HYDRA Chronicles, a crypto blog. Today is ${TODAY}. ${TOPIC} The article must be well-structured and at least 400 words. Always finish the content field with this disclaimer: ${DISCLAIMER} Return ONLY a raw valid JSON object with no markdown fences, no extra text. Use this exact structure: {\"id\":\"${SLUG}\",\"title\":\"string\",\"slug\":\"${SLUG}\",\"excerpt\":\"max 200 chars summary\",\"content\":\"full article in markdown using \\n for newlines\",\"category\":\"News\",\"author\":\"HYDRA AI\",\"date\":\"${TODAY}\",\"readingTime\":5,\"featured\":false,\"coverImage\":\"\",\"tags\":${TAGS}}"

          PAYLOAD=$(python3 -c "
import json, sys
prompt = sys.argv[1]
body = {
  'model': 'google/gemini-2.0-flash-exp:free',
  'messages': [{'role': 'user', 'content': prompt}],
  'temperature': 0.85,
  'max_tokens': 2500
}
print(json.dumps(body))
" "$FULL_PROMPT")

          RESPONSE=$(curl -s https://openrouter.ai/api/v1/chat/completions \
            -H "Authorization: Bearer $OPENROUTER_API_KEY" \
            -H "Content-Type: application/json" \
            -H "HTTP-Referer: https://hydraxrd.com" \
            -H "X-Title: HYDRA Blog" \
            -d "$PAYLOAD")

          POST_JSON=$(echo "$RESPONSE" | python3 -c "
import json, sys
data = json.load(sys.stdin)
content = data['choices'][0]['message']['content'].strip()
if content.startswith('\x60\x60\x60'):
    lines = content.split('\n')
    content = '\n'.join(lines[1:-1])
print(content)
")

          echo "$POST_JSON" > "src/data/posts/${SLUG}.json"
          echo "slug=${SLUG}" >> $GITHUB_OUTPUT
          echo "Done: src/data/posts/${SLUG}.json"

      - name: Commit and push new post
        run: |
          git config user.name "HYDRA AI Bot"
          git config user.email "bot@hydraxrd.com"
          git add src/data/posts/
          git diff --cached --quiet || git commit -m "Auto post: ${{ steps.generate.outputs.slug }}"
          git push
