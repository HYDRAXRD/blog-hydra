name: AI Auto Blog Post

on:
  schedule:
    # === FASE 1: Semanas 1-2 (3 posts/dia) ===
    - cron: '0 11 * * *'   # 08:00 Brasilia
    - cron: '0 17 * * *'   # 14:00 Brasilia
    - cron: '0 23 * * *'   # 20:00 Brasilia

    # === FASE 2: Semanas 3-4 (+ 2 posts extras = 5/dia) ===
    - cron: '0 7 2-30 9 *'   # 04:00 Brasilia - setembro em diante
    - cron: '0 14 2-30 9 *'  # 11:00 Brasilia - setembro em diante

    # === FASE 3: Mes 2+ (+ 3 posts extras = 8/dia) ===
    - cron: '0 2 19-30 9 *'   # 23:00 Brasilia
    - cron: '0 5 19-30 9 *'   # 02:00 Brasilia
    - cron: '0 20 19-30 9 *'  # 17:00 Brasilia

    # Outubro em diante: 8 posts/dia completo
    - cron: '0 2 * 10-12 *'
    - cron: '0 5 * 10-12 *'
    - cron: '0 7 * 10-12 *'
    - cron: '0 14 * 10-12 *'
    - cron: '0 20 * 10-12 *'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.3.1  # Node.js 24 compatible
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0  # full history needed for push

      - name: Generate post
        id: generate
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -e
          python3 .github/scripts/generate_post.py | tee /tmp/out.txt
          SLUG=$(grep 'SLUG:' /tmp/out.txt | cut -d: -f2 | tr -d ' ')
          echo "slug=$SLUG" >> $GITHUB_OUTPUT
          echo "Generated slug: $SLUG"

      - name: Commit and push post
        run: |
          git config user.name "HYDRA AI Bot"
          git config user.email "bot@hydraxrd.com"
          git pull --rebase origin main
          git add src/data/posts/ public/posts-index.json
          if git diff --cached --quiet; then
            echo "Nothing to commit, skipping push"
            exit 0
          fi
          git commit -m "Auto post: ${{ steps.generate.outputs.slug }}"
          git push origin main
          echo "Post pushed — Cloudflare deploy triggered automatically"
