name: AI Auto Blog Post

on:
  schedule:
    - cron: '0 11 * * *'   # 08:00 Brasilia
    - cron: '0 17 * * *'   # 14:00 Brasilia
    - cron: '0 23 * * *'   # 20:00 Brasilia
    - cron: '0 7 2-30 9 *'
    - cron: '0 14 2-30 9 *'
    - cron: '0 2 19-30 9 *'
    - cron: '0 5 19-30 9 *'
    - cron: '0 20 19-30 9 *'
    - cron: '0 2 * 10-12 *'
    - cron: '0 5 * 10-12 *'
    - cron: '0 7 * 10-12 *'
    - cron: '0 14 * 10-12 *'
    - cron: '0 20 * 10-12 *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Generate post
        id: generate
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -e
          python3 .github/scripts/generate_post.py | tee /tmp/gen.txt
          SLUG=$(grep 'SLUG:' /tmp/gen.txt | cut -d: -f2 | tr -d ' ')
          POST_FILE=$(grep 'SUCCESS:' /tmp/gen.txt | cut -d: -f2 | tr -d ' ')
          echo "slug=$SLUG" >> $GITHUB_OUTPUT
          echo "post_file=$POST_FILE" >> $GITHUB_OUTPUT
          echo "Generated: $POST_FILE"

      - name: Commit and push post
        env:
          POST_FILE: ${{ steps.generate.outputs.post_file }}
          SLUG: ${{ steps.generate.outputs.slug }}
        run: |
          set -e

          # Backup dos arquivos gerados ANTES de qualquer operacao git
          cp "$POST_FILE" /tmp/new-post.json
          cp public/posts-index.json /tmp/posts-index.json
          echo "Backed up: $POST_FILE"

          git config user.name "HYDRA AI Bot"
          git config user.email "bot@hydraxrd.com"

          # Sincroniza com remoto (sem --rebase, sem stash)
          git fetch origin main
          git reset --hard origin/main

          # Restaura os arquivos gerados
          mkdir -p src/data/posts public
          cp /tmp/new-post.json "$POST_FILE"
          cp /tmp/posts-index.json public/posts-index.json
          echo "Restored: $POST_FILE"

          git add "$POST_FILE" public/posts-index.json
          git status

          if git diff --cached --quiet; then
            echo "Nothing to commit, skipping"
            exit 0
          fi

          git commit -m "Auto post: $SLUG"
          git push origin main
          echo "SUCCESS: post pushed, Cloudflare deploy triggered"
