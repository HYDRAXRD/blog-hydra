name: AI Auto Blog Post

on:
  schedule:
    - cron: '0 11 * * *'   # 08:00 Brasilia
    - cron: '0 17 * * *'   # 14:00 Brasilia
    - cron: '0 23 * * *'   # 20:00 Brasilia
    - cron: '0 7 2-30 9 *'
    - cron: '0 14 2-30 9 *'
    - cron: '0 2 19-30 9 *'
    - cron: '0 5 19-30 9 *'
    - cron: '0 20 19-30 9 *'
    - cron: '0 2 * 10-12 *'
    - cron: '0 5 * 10-12 *'
    - cron: '0 7 * 10-12 *'
    - cron: '0 14 * 10-12 *'
    - cron: '0 20 * 10-12 *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install dependencies
        run: |
          set -e
          echo "=== Python version ==="
          python3 --version
          echo "=== Installing dependencies ==="
          pip install --upgrade pip
          pip install requests
          # pytrends is optional — install with fallback so failures don't block the workflow
          pip install pytrends || echo "WARNING: pytrends install failed — will use curated fallback topics"
          echo "=== Verifying required imports ==="
          python3 -c "import requests; print('OK: requests imported')"
          echo "=== Checking pytrends (optional) ==="
          python3 -c "import pytrends; print('OK: pytrends imported')" || echo "INFO: pytrends not available — curated fallback will be used"

      - name: Syntax check script
        run: |
          set -e
          echo "=== Syntax check ==="
          python3 -m py_compile .github/scripts/generate_post.py
          echo "Syntax OK"

      - name: Generate post
        id: generate
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          UNSPLASH_API_KEY: ${{ secrets.UNSPLASH_API_KEY }}
          API_KEY_CMC: ${{ secrets.API_KEY_CMC }}
          API_KEY_COINGECKO: ${{ secrets.API_KEY_COINGECKO }}
        run: |
          set -e

          # Purge stale Python bytecode
          find .github/scripts -name "*.pyc" -delete 2>/dev/null || true
          find .github/scripts -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true

          # Run script and capture output + exit code
          python3 -B .github/scripts/generate_post.py > /tmp/gen.txt 2>&1
          PYTHON_EXIT=$?

          cat /tmp/gen.txt
          echo "--- Python exit code: $PYTHON_EXIT ---"

          if [ "$PYTHON_EXIT" != "0" ]; then
            echo "ERROR: generate_post.py failed with exit code $PYTHON_EXIT"
            exit 1
          fi

          # Extract outputs
          SLUG=$(grep '^SLUG:' /tmp/gen.txt | tail -1 | cut -d: -f2 | tr -d ' \r\n')
          POST_FILE=$(grep '^SUCCESS:' /tmp/gen.txt | tail -1 | sed 's/^SUCCESS://' | tr -d ' \r\n')

          echo "Captured SLUG='$SLUG'"
          echo "Captured POST_FILE='$POST_FILE'"

          # Hard-fail on empty outputs
          if [ -z "$SLUG" ]; then
            echo "ERROR: SLUG is empty - script did not print a SLUG: line"
            tail -30 /tmp/gen.txt
            exit 1
          fi

          if [ -z "$POST_FILE" ]; then
            echo "ERROR: POST_FILE is empty - script did not print a SUCCESS: line"
            tail -30 /tmp/gen.txt
            exit 1
          fi

          # Validate files exist
          if [ ! -f "$POST_FILE" ]; then
            echo "ERROR: post file '$POST_FILE' not found on disk"
            ls -la src/data/posts/ 2>/dev/null || echo "(posts dir missing)"
            exit 1
          fi

          if [ ! -f "public/posts-index.json" ]; then
            echo "ERROR: public/posts-index.json not found"
            exit 1
          fi

          if [ ! -f "public/sitemap.xml" ]; then
            echo "ERROR: public/sitemap.xml not found"
            exit 1
          fi

          # Backup before git reset
          mkdir -p /tmp/hydra-backup
          cp "$POST_FILE"              /tmp/hydra-backup/new-post.json
          cp public/posts-index.json   /tmp/hydra-backup/posts-index.json
          cp public/sitemap.xml        /tmp/hydra-backup/sitemap.xml
          echo "Backup OK"

          # Export outputs
          echo "slug=$SLUG"           >> "$GITHUB_OUTPUT"
          echo "post_file=$POST_FILE" >> "$GITHUB_OUTPUT"
          echo "Generated: $POST_FILE (slug: $SLUG)"

      - name: Commit and push post
        env:
          POST_FILE: ${{ steps.generate.outputs.post_file }}
          SLUG: ${{ steps.generate.outputs.slug }}
        run: |
          set -e

          if [ -z "$SLUG" ] || [ -z "$POST_FILE" ]; then
            echo "ERROR: SLUG or POST_FILE is empty - aborting"
            exit 1
          fi

          git config user.name  "HYDRA AI Bot"
          git config user.email "bot@hydraxrd.com"

          git fetch origin main
          git reset --hard origin/main

          mkdir -p src/data/posts public
          cp /tmp/hydra-backup/new-post.json    "$POST_FILE"
          cp /tmp/hydra-backup/posts-index.json public/posts-index.json
          cp /tmp/hydra-backup/sitemap.xml      public/sitemap.xml
          echo "Restored files"

          git add "$POST_FILE" public/posts-index.json public/sitemap.xml
          git status

          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi

          git commit -m "Auto post: $SLUG"
          git push origin main
          echo "SUCCESS: pushed - Cloudflare deploy triggered"
