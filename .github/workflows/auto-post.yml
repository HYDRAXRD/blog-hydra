name: AI Auto Blog Post

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate post
        id: generate
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python3 .github/scripts/generate_post.py | tee /tmp/out.txt
          echo "slug=$(grep 'SLUG:' /tmp/out.txt | cut -d: -f2)" >> $GITHUB_OUTPUT

      - name: Commit and push
        run: |
          git config user.name "HYDRA AI Bot"
          git config user.email "bot@hydraxrd.com"
          git add src/data/posts/
          git diff --cached --quiet || git commit -m "Auto post: ${{ steps.generate.outputs.slug }}"
          git push
