name: AI Auto Blog Post

on:
  schedule:
    # === FASE 1: Semanas 1-2 (3 posts/dia) ===
    # Ativo sempre - horarios base
    - cron: '0 11 * * *'   # 08:00 Brasilia
    - cron: '0 17 * * *'   # 14:00 Brasilia
    - cron: '0 23 * * *'   # 20:00 Brasilia

    # === FASE 2: Semanas 3-4 (+ 2 posts extras = 5/dia) ===
    # Ativo a partir de 02/09/2026
    - cron: '0 7 2-30 9 *'   # 04:00 Brasilia - setembro em diante
    - cron: '0 14 2-30 9 *'  # 11:00 Brasilia - setembro em diante

    # === FASE 3: Mes 2+ (+ 3 posts extras = 8/dia) ===
    # Ativo a partir de 19/09/2026
    - cron: '0 2 19-30 9 *'   # 23:00 Brasilia - a partir de 19/09
    - cron: '0 5 19-30 9 *'   # 02:00 Brasilia - a partir de 19/09
    - cron: '0 20 19-30 9 *'  # 17:00 Brasilia - a partir de 19/09

    # Outubro em diante: 8 posts/dia completo
    - cron: '0 2 * 10-12 *'   # 23:00 Brasilia
    - cron: '0 5 * 10-12 *'   # 02:00 Brasilia
    - cron: '0 7 * 10-12 *'   # 04:00 Brasilia
    - cron: '0 14 * 10-12 *'  # 11:00 Brasilia
    - cron: '0 20 * 10-12 *'  # 17:00 Brasilia

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Generate post
        id: generate
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python3 .github/scripts/generate_post.py | tee /tmp/out.txt
          echo "slug=$(grep 'SLUG:' /tmp/out.txt | cut -d: -f2)" >> $GITHUB_OUTPUT

      - name: Commit and push
        run: |
          git config user.name "HYDRA AI Bot"
          git config user.email "bot@hydraxrd.com"
          git add src/data/posts/ public/posts-index.json
          git diff --cached --quiet || git commit -m "Auto post: ${{ steps.generate.outputs.slug }}"
          git push

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build site
        run: bun run build

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler deploy
