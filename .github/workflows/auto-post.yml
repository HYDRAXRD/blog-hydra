name: AI Auto Blog Post

on:
  schedule:
    - cron: '0 11 * * *'
    - cron: '0 17 * * *'
    - cron: '0 23 * * *'
    - cron: '0 7 2-30 9 *'
    - cron: '0 14 2-30 9 *'
    - cron: '0 2 19-30 9 *'
    - cron: '0 5 19-30 9 *'
    - cron: '0 20 19-30 9 *'
    - cron: '0 2 * 10-12 *'
    - cron: '0 5 * 10-12 *'
    - cron: '0 7 * 10-12 *'
    - cron: '0 14 * 10-12 *'
    - cron: '0 20 * 10-12 *'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Diagnose environment
        run: |
          echo "=== Python version ==="
          python3 --version
          echo "=== Script exists ==="
          ls -la .github/scripts/generate_post.py
          echo "=== OPENROUTER_API_KEY set ==="
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "ERROR: OPENROUTER_API_KEY is NOT set!"
          else
            echo "OK: key starts with ${OPENROUTER_API_KEY:0:8}..."
          fi
          echo "=== Git remote ==="
          git remote -v
          echo "=== Git status ==="
          git status
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Generate post
        id: generate
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -e
          python3 .github/scripts/generate_post.py | tee /tmp/out.txt
          SLUG=$(grep 'SLUG:' /tmp/out.txt | cut -d: -f2 | tr -d ' ')
          echo "slug=$SLUG" >> $GITHUB_OUTPUT
          echo "Generated slug: $SLUG"

      - name: Commit and push post
        run: |
          git config user.name "HYDRA AI Bot"
          git config user.email "bot@hydraxrd.com"
          git pull --rebase origin main
          git add src/data/posts/ public/posts-index.json
          if git diff --cached --quiet; then
            echo "Nothing to commit, skipping push"
            exit 0
          fi
          git commit -m "Auto post: ${{ steps.generate.outputs.slug }}"
          git push origin main
          echo "Post pushed - Cloudflare deploy triggered automatically"
